# Version updates for what Ferrolua uses. Cargo has no entry, because the dependency rule
# (`.claude/rules/dependencies.md`) allows no third-party crates.
version: 2
updates:
  # New Rust releases for `rust-toolchain.toml`. Review each one as a change of its own: update the
  # version where the documents name it, such as `CONTRIBUTING.md`, and decide whether
  # `rust-version` in `Cargo.toml` moves with it.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(workspace)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
